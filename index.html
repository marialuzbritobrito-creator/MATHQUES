<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathQuest - A Gamificação da Matemática</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff007f;
            --secondary-color: #00f0ff;
            --bg-dark: #0d0e15;
            --card-bg: #161824;
            --text-color: #ffffff;
            --success-color: #00ff66;
            --danger-color: #ff3366;
            --font-pixel: 'Press Start 2P', cursive;
            --font-main: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        header {
            width: 100%; max-width: 900px; text-align: center; margin-bottom: 20px;
            border: 2px solid var(--primary-color); padding: 15px; border-radius: 12px;
            background: rgba(22, 24, 36, 0.9); box-shadow: 0 0 15px var(--primary-color);
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }

        header h1 { font-family: var(--font-pixel); font-size: 1.4rem; color: var(--secondary-color); }

        .container {
            width: 100%; max-width: 900px; background: var(--card-bg);
            border: 2px solid var(--primary-color); border-radius: 16px; padding: 25px;
        }

        .user-nav {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.05); padding: 10px 15px; border-radius: 10px; margin-bottom: 20px;
        }

        .main-tabs { display: flex; gap: 6px; width: 100%; margin-bottom: 20px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; overflow-x: auto; }

        .tab-btn {
            flex: 1; padding: 12px 10px; background: #202436; border: 1px solid #333;
            color: #fff; border-radius: 8px; font-family: var(--font-pixel); font-size: 0.6rem; cursor: pointer; text-align: center;
        }

        .tab-btn.active { background: var(--primary-color); border-color: var(--primary-color); }

        .screen { display: none; }
        .screen.active { display: block; }

        h2.screen-title { font-family: var(--font-pixel); font-size: 0.9rem; color: var(--primary-color); margin-bottom: 20px; text-align: center; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 700; color: #ddd; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0d0e15; color: #fff; font-size: 1rem; outline: none;
        }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-family: var(--font-pixel); font-size: 0.7rem; cursor: pointer; text-transform: uppercase;
        }

        .btn-primary { background: var(--primary-color); color: #fff; }
        .btn-secondary { background: var(--secondary-color); color: #0d0e15; font-weight: bold; }
        
        .btn-outline {
            background: transparent; border: 1px solid #fff; color: #fff; padding: 12px;
            font-size: 0.9rem; width: 100%; text-align: left; border-radius: 8px; cursor: pointer; margin-bottom: 8px;
        }

        .btn-correct { background: rgba(0, 255, 102, 0.2) !important; border-color: var(--success-color) !important; color: var(--success-color) !important; font-weight: bold; }
        .btn-wrong { background: rgba(255, 51, 102, 0.2) !important; border-color: var(--danger-color) !important; color: var(--danger-color) !important; }

        .explanation-box {
            background: rgba(0, 240, 255, 0.1); border: 1px solid var(--secondary-color);
            border-radius: 8px; padding: 15px; margin-top: 15px; font-size: 0.95rem; display: none;
        }

        .area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .area-card { background: #202436; border: 1px solid #333a52; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; }

        /* ESTILOS DO CONSTRUTOR FORMS */
        .question-builder-card {
            background: #1c1f30; border: 1px solid var(--secondary-color);
            border-radius: 10px; padding: 15px; margin-bottom: 20px;
        }

        .opt-input-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
        }

        .opt-radio { width: 20px; height: 20px; cursor: pointer; }

        .btn-add-opt {
            background: #282c42; border: 1px dashed var(--secondary-color);
            color: var(--secondary-color); padding: 6px 12px; border-radius: 6px;
            font-size: 0.8rem; cursor: pointer; margin-top: 5px;
        }

        .btn-add-question {
            background: #202436; border: 2px dashed var(--primary-color);
            color: #fff; padding: 15px; border-radius: 10px; font-family: var(--font-pixel);
            font-size: 0.8rem; width: 100%; cursor: pointer; margin-bottom: 20px;
        }

        .teacher-quiz-card {
            background: rgba(0, 240, 255, 0.08); border: 1px solid var(--secondary-color);
            border-radius: 8px; padding: 15px; margin-bottom: 12px; cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo-icon">📐</div>
        <div>
            <h1>MATHQUEST</h1>
            <p style="color:#aaa;">A Gamificação da Matemática</p>
        </div>
    </header>

    <div class="container">
        <!-- NAVEGAÇÃO SUPERIOR -->
        <div id="user-nav" class="user-nav" style="display: none;">
            <div>
                <h4 id="nav-username">Usuário</h4>
                <span id="nav-grade" style="color:var(--secondary-color); font-size:0.85rem;"></span>
            </div>
            <button class="btn" style="width:auto; padding:6px 12px; background:transparent; border:1px solid #fff; color:#fff;" onclick="logout()">Sair</button>
        </div>

        <!-- TABS -->
        <div id="main-tabs" class="main-tabs" style="display: none;">
            <button id="tab-btn-quizzes" class="tab-btn active" onclick="switchTab('screen-quizzes')">📚 QUIZZES</button>
            <button id="tab-btn-teacher" class="tab-btn hidden" onclick="switchTab('screen-teacher-dash')">🎓 CRIAR QUIZ (PROFESSOR)</button>
        </div>

        <!-- LOGIN -->
        <div id="screen-login" class="screen active">
            <h2 class="screen-title">Entrar na Conta</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Nome de Usuário</label>
                    <input type="text" id="login-name" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary">ENTRAR AGORA 🚀</button>
            </form>
            <p style="text-align:center; margin-top:15px;">
                Sem conta? <a href="#" onclick="showScreen('screen-register')" style="color:var(--secondary-color);">Cadastre-se</a>
            </p>
        </div>

        <!-- CADASTRO -->
        <div id="screen-register" class="screen">
            <h2 class="screen-title">Criar Sua Conta</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="reg-name" required>
                </div>
                <div class="form-group">
                    <label>Perfil</label>
                    <select id="reg-role" required>
                        <option value="Aluno">Aluno</option>
                        <option value="Professor">Professor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Série / Ano</label>
                    <input type="text" id="reg-grade" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="reg-password" required minlength="4">
                </div>
                <button type="submit" class="btn btn-secondary">CRIAR CONTA ✨</button>
            </form>
        </div>

        <!-- TELA QUIZZES -->
        <div id="screen-quizzes" class="screen">
            <!-- SEÇÃO DE QUIZZES DOS PROFESSORES -->
            <div id="teacher-quizzes-section" style="margin-bottom:25px;">
                <h3 style="color:var(--secondary-color); font-family:var(--font-pixel); font-size:0.75rem; margin-bottom:12px;">📌 QUIZZES CRIADOS POR PROFESSORES</h3>
                <div id="teacher-quizzes-container"></div>
            </div>

            <h2 class="screen-title">Áreas de Estudo Padrão</h2>
            <div id="area-grid-container" class="area-grid"></div>
        </div>

        <!-- TELA PAINEL PROFESSOR (CONSTRUTOR FORMS) -->
        <div id="screen-teacher-dash" class="screen">
            <h2 class="screen-title">🎓 Criador de Quizzes (Estilo Forms)</h2>
            
            <form onsubmit="saveCustomQuiz(event)">
                <div class="form-group">
                    <label>Título / Tema do Quiz</label>
                    <input type="text" id="form-quiz-title" placeholder="Ex: Prova Mensal de Funções e Álgebra" required>
                </div>

                <div class="form-group">
                    <label>Área Temática Principal</label>
                    <select id="form-quiz-area" required></select>
                </div>

                <!-- CONTAINER DE PERGUNTAS DINÂMICAS -->
                <div id="questions-builder-container"></div>

                <!-- MAISÃO PARA MAIS UMA PERGUNTA -->
                <button type="button" class="btn-add-question" onclick="addQuestionCard()">➕ ADICIONAR NOVA PERGUNTA</button>

                <button type="submit" class="btn btn-primary">PUBLICAR QUIZ PARA OS ALUNOS 🚀</button>
            </form>
        </div>

        <!-- EXECUÇÃO DO QUIZ -->
        <div id="screen-game" class="screen">
            <div style="display:flex; justify-content:space-between; color:var(--primary-color); font-weight:bold; margin-bottom:10px;">
                <span id="game-area-tag"></span>
                <span id="game-progress"></span>
            </div>
            <div id="game-author-tag" style="color:var(--secondary-color); font-size:0.85rem; margin-bottom:15px; font-weight:bold;"></div>

            <div id="game-question" style="font-size:1.15rem; font-weight:700; margin-bottom:20px; line-height:1.4;"></div>
            <div id="game-options"></div>

            <div id="game-explanation" class="explanation-box">
                <strong style="color:var(--secondary-color);">💡 Explicação / Gabarito:</strong>
                <p id="explanation-text" style="margin-top:5px;"></p>
            </div>

            <button id="btn-next-question" class="btn btn-primary" style="display:none; margin-top:20px;" onclick="nextQuestion()">PRÓXIMA QUESTÃO ➔</button>
        </div>

    </div>

    <script>
        let currentUser = null;
        let questionCount = 0;
        let currentGameQuizzes = [];
        let currentQuestionIndex = 0;
        let userScore = 0;
        let answeredCurrent = false;

        const allAreas = [
            "Álgebra", "Geometria Plana", "Geometria Espacial", "Raciocínio Lógico", "Trigonometria",
            "Aritmética", "Estatística", "Probabilidade", "Funções", "Matemática Financeira"
        ];

        window.onload = function() {
            renderAreaCards();
            populateAreaSelect();
            checkActiveSession();
        };

        function renderAreaCards() {
            const container = document.getElementById('area-grid-container');
            container.innerHTML = allAreas.map(area => `
                <div class="area-card" onclick="startStandardAreaQuiz('${area}')">
                    <h4 style="color:#fff; margin-bottom:5px;">${area}</h4>
                    <small style="color:var(--secondary-color);">10 Questões</small>
                </div>
            `).join('');
        }

        function populateAreaSelect() {
            document.getElementById('form-quiz-area').innerHTML = allAreas.map(a => `<option value="${a}">${a}</option>`).join('');
        }

        function switchTab(screenId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (screenId === 'screen-quizzes') document.getElementById('tab-btn-quizzes').classList.add('active');
            if (screenId === 'screen-teacher-dash') document.getElementById('tab-btn-teacher').classList.add('active');
            showScreen(screenId);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'screen-quizzes') renderTeacherQuizzesList();
            if (screenId === 'screen-teacher-dash' && questionCount === 0) addQuestionCard();
        }

        function checkActiveSession() {
            const loggedUsername = localStorage.getItem('mathquest_logged_user');
            const users = JSON.parse(localStorage.getItem('mathquest_users') || '{}');

            if (loggedUsername && users[loggedUsername]) {
                currentUser = { name: loggedUsername, ...users[loggedUsername] };
                document.getElementById('user-nav').style.display = 'flex';
                document.getElementById('main-tabs').style.display = 'flex';
                document.getElementById('nav-username').innerText = currentUser.name;
                document.getElementById('nav-grade').innerText = `${currentUser.role} - ${currentUser.grade}`;

                if (currentUser.role === 'Professor') {
                    document.getElementById('tab-btn-teacher').classList.remove('hidden');
                } else {
                    document.getElementById('tab-btn-teacher').classList.add('hidden');
                }

                switchTab('screen-quizzes');
            } else {
                document.getElementById('user-nav').style.display = 'none';
                document.getElementById('main-tabs').style.display = 'none';
                showScreen('screen-login');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const role = document.getElementById('reg-role').value;
            const grade = document.getElementById('reg-grade').value.trim();
            const password = document.getElementById('reg-password').value;

            let users = JSON.parse(localStorage.getItem('mathquest_users') || '{}');
            users[name] = { password, role, grade, score: 0 };
            localStorage.setItem('mathquest_users', JSON.stringify(users));
            localStorage.setItem('mathquest_logged_user', name);
            checkActiveSession();
        }

        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('login-name').value.trim();
            const password = document.getElementById('login-password').value;
            let users = JSON.parse(localStorage.getItem('mathquest_users') || '{}');

            if (!users[name] || users[name].password !== password) {
                alert("Usuário ou senha incorretos!");
                return;
            }

            localStorage.setItem('mathquest_logged_user', name);
            checkActiveSession();
        }

        function logout() {
            localStorage.removeItem('mathquest_logged_user');
            currentUser = null;
            checkActiveSession();
        }

        /* LÓGICA DO CONSTRUTOR ESTILO GOOGLE FORMS */
        function addQuestionCard() {
            questionCount++;
            const qId = questionCount;
            const container = document.getElementById('questions-builder-container');

            const card = document.createElement('div');
            card.className = 'question-builder-card';
            card.id = `q-card-${qId}`;
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <strong style="color:var(--secondary-color);">Pergunta #${qId}</strong>
                    <button type="button" style="background:transparent; border:none; color:var(--danger-color); cursor:pointer;" onclick="removeQuestionCard(${qId})">🗑️ Remover</button>
                </div>
                <div class="form-group">
                    <input type="text" class="q-title-input" placeholder="Digite o enunciado da pergunta..." required>
                </div>
                <div class="form-group">
                    <label>Tipo de Resposta</label>
                    <select onchange="handleQuestionTypeChange(${qId}, this.value)">
                        <option value="multiple">Múltipla Escolha</option>
                        <option value="tf">Verdadeiro ou Falso</option>
                    </select>
                </div>
                <label style="display:block; margin-bottom:8px; font-weight:bold;">Alternativas (Marque a bolinha da correta):</label>
                <div class="options-list-container" id="opts-container-${qId}"></div>
                
                <button type="button" class="btn-add-opt" id="add-opt-btn-${qId}" onclick="addOptionRow(${qId})">➕ Adicionar Alternativa</button>

                <div class="form-group" style="margin-top:15px;">
                    <label>Explicação / Passo a Passo (Opcional):</label>
                    <input type="text" class="q-exp-input" placeholder="Explique por que essa resposta é a correta...">
                </div>
            `;

            container.appendChild(card);
            addOptionRow(qId, "Opção 1");
            addOptionRow(qId, "Opção 2");
        }

        function removeQuestionCard(qId) {
            const card = document.getElementById(`q-card-${qId}`);
            if (card) card.remove();
        }

        function addOptionRow(qId, defaultText = "") {
            const optsContainer = document.getElementById(`opts-container-${qId}`);
            const optIndex = optsContainer.children.length;

            const row = document.createElement('div');
            row.className = 'opt-input-row';
            row.innerHTML = `
                <input type="radio" name="correct-opt-${qId}" class="opt-radio" ${optIndex === 0 ? 'checked' : ''} required>
                <input type="text" class="opt-text-input" placeholder="Texto da alternativa..." value="${defaultText}" required>
                <button type="button" style="background:transparent; border:none; color:#ff3366; cursor:pointer;" onclick="this.parentElement.remove()">✕</button>
            `;
            optsContainer.appendChild(row);
        }

        function handleQuestionTypeChange(qId, type) {
            const optsContainer = document.getElementById(`opts-container-${qId}`);
            const addBtn = document.getElementById(`add-opt-btn-${qId}`);
            optsContainer.innerHTML = '';

            if (type === 'tf') {
                addBtn.style.display = 'none';
                addOptionRow(qId, "Verdadeiro");
                addOptionRow(qId, "Falso");
            } else {
                addBtn.style.display = 'inline-block';
                addOptionRow(qId, "Opção 1");
                addOptionRow(qId, "Opção 2");
            }
        }

        function saveCustomQuiz(e) {
            e.preventDefault();
            const title = document.getElementById('form-quiz-title').value.trim();
            const area = document.getElementById('form-quiz-area').value;
            const cards = document.querySelectorAll('.question-builder-card');

            if (cards.length === 0) {
                alert("Adicione pelo menos uma pergunta!");
                return;
            }

            const questions = [];

            cards.forEach(card => {
                const qTitle = card.querySelector('.q-title-input').value.trim();
                const qExp = card.querySelector('.q-exp-input').value.trim();
                const rows = card.querySelectorAll('.opt-input-row');

                const opts = [];
                let correctAns = "";

                rows.forEach(row => {
                    const text = row.querySelector('.opt-text-input').value.trim();
                    const isCorrect = row.querySelector('.opt-radio').checked;
                    opts.push(text);
                    if (isCorrect) correctAns = text;
                });

                questions.push({
                    q: qTitle,
                    opts: opts,
                    ans: correctAns,
                    exp: qExp || "Resposta definida pelo professor."
                });
            });

            let teacherQuizzes = JSON.parse(localStorage.getItem('mathquest_teacher_quizzes') || '[]');
            teacherQuizzes.push({
                id: Date.now(),
                title: title,
                area: area,
                author: currentUser.name,
                questions: questions
            });

            localStorage.setItem('mathquest_teacher_quizzes', JSON.stringify(teacherQuizzes));
            alert("Quiz publicado com sucesso para toda a turma!");
            document.getElementById('questions-builder-container').innerHTML = '';
            questionCount = 0;
            switchTab('screen-quizzes');
        }

        function renderTeacherQuizzesList() {
            const teacherQuizzes = JSON.parse(localStorage.getItem('mathquest_teacher_quizzes') || '[]');
            const container = document.getElementById('teacher-quizzes-container');

            if (teacherQuizzes.length === 0) {
                container.innerHTML = `<p style="color:#aaa; font-size:0.85rem;">Nenhum quiz publicado por professores ainda.</p>`;
                return;
            }

            container.innerHTML = teacherQuizzes.map(q => `
                <div class="teacher-quiz-card" onclick="startTeacherCustomQuiz(${q.id})">
                    <h4 style="color:#fff;">${q.title}</h4>
                    <p style="font-size:0.85rem; color:#ccc; margin-top:4px;">
                        👨‍🏫 Professor: <strong style="color:var(--secondary-color);">${q.author}</strong> | Área: ${q.area} | ${q.questions.length} Questões
                    </p>
                </div>
            `).join('');
        }

        /* EXECUÇÃO E CORREÇÃO DO QUIZ */
        function startTeacherCustomQuiz(quizId) {
            const teacherQuizzes = JSON.parse(localStorage.getItem('mathquest_teacher_quizzes') || '[]');
            const quiz = teacherQuizzes.find(q => q.id === quizId);
            if (!quiz) return;

            currentGameQuizzes = quiz.questions.map(q => ({
                area: quiz.area,
                author: quiz.author,
                title: quiz.title,
                question: q.q,
                shuffledOptions: q.opts,
                correctAnswer: q.ans,
                explanation: q.exp
            }));

            currentQuestionIndex = 0;
            userScore = 0;
            showScreen('screen-game');
            loadQuestion();
        }

        function startStandardAreaQuiz(area) {
            // Quiz Padrão
            currentGameQuizzes = Array.from({ length: 5 }, (_, i) => ({
                area: area,
                author: null,
                question: `Questão ${i+1} de ${area}: Quanto é ${(i+2)*3} + ${i+5}?`,
                shuffledOptions: [`${(i+2)*3 + i + 5}`, `${(i+2)*3 + i + 2}`, `${(i+2)*3}`, "100"],
                correctAnswer: `${(i+2)*3 + i + 5}`,
                explanation: `A resposta correta é ${(i+2)*3 + i + 5}.`
            }));

            currentQuestionIndex = 0;
            userScore = 0;
            showScreen('screen-game');
            loadQuestion();
        }

        function loadQuestion() {
            answeredCurrent = false;
            const q = currentGameQuizzes[currentQuestionIndex];

            document.getElementById('game-area-tag').innerText = q.area;
            document.getElementById('game-progress').innerText = `Questão ${currentQuestionIndex + 1}/${currentGameQuizzes.length}`;
            
            if (q.author) {
                document.getElementById('game-author-tag').innerText = `👨‍🏫 Quiz Criado pelo Professor: ${q.author} (${q.title})`;
                document.getElementById('game-author-tag').style.display = 'block';
            } else {
                document.getElementById('game-author-tag').style.display = 'none';
            }

            document.getElementById('game-question').innerText = q.question;
            document.getElementById('btn-next-question').style.display = 'none';
            document.getElementById('game-explanation').style.display = 'none';

            const container = document.getElementById('game-options');
            container.innerHTML = q.shuffledOptions.map((opt, idx) => `
                <button class="btn-outline option-btn" id="opt-btn-${idx}" onclick="checkAnswer(${idx})">
                    ${opt}
                </button>
            `).join('');
        }

        function checkAnswer(selectedIdx) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const q = currentGameQuizzes[currentQuestionIndex];
            const selectedOpt = q.shuffledOptions[selectedIdx];
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach(btn => btn.disabled = true);

            // SÓ REVELA A CORREÇÃO DEPOIS DO CLIQUE DO ALUNO
            if (selectedOpt === q.correctAnswer) {
                userScore += 10;
                document.getElementById(`opt-btn-${selectedIdx}`).classList.add('btn-correct');
                document.getElementById(`opt-btn-${selectedIdx}`).innerHTML += ' ✔ (Você acertou!)';
            } else {
                document.getElementById(`opt-btn-${selectedIdx}`).classList.add('btn-wrong');
                document.getElementById(`opt-btn-${selectedIdx}`).innerHTML += ' ✖ (Incorreto)';

                // Revela a opção certa para o aluno que errou
                q.shuffledOptions.forEach((opt, idx) => {
                    if (opt === q.correctAnswer) {
                        document.getElementById(`opt-btn-${idx}`).classList.add('btn-correct');
                        document.getElementById(`opt-btn-${idx}`).innerHTML += ' ✔ (Resposta Correta)';
                    }
                });
            }

            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('game-explanation').style.display = 'block';
            document.getElementById('btn-next-question').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentGameQuizzes.length) {
                loadQuestion();
            } else {
                alert(`Parabéns! Você concluiu o quiz e fez ${userScore} pontos.`);
                switchTab('screen-quizzes');
            }
        }
    </script>
</body>
</html>
