<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MATHQUEST - Gamificação em Tempo Real</title>
  
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #ff0055;
      --user-theme-color: #00ff66;
      --text-color: #ffffff;
      --border-color: #30363d;
      --font-pixel: 'VT323', monospace;
    }

    * { box-sizing: border-box; font-family: var(--font-pixel); }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0 0 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-size: 20px;
    }

    /* BANNER DA LOGO QUE TAMPA O TOPO */
    .banner-container {
      width: 100%;
      max-width: 950px;
      background-color: #161b22;
      border-bottom: 4px solid var(--user-theme-color);
      text-align: center;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .banner-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      image-rendering: pixelated;
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      background-color: var(--card-bg);
      border: 3px solid var(--user-theme-color);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
    }

    /* SISTEMA DE ABAS LADO A LADO */
    .nav-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 15px;
      background: #21262d;
      color: #8b949e;
      border: 2px solid var(--border-color);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 20px;
      text-align: center;
      white-space: nowrap;
      margin: 0;
      box-shadow: none;
    }

    .tab-btn.active {
      background: var(--user-theme-color);
      color: #000;
      font-weight: bold;
      border-color: var(--user-theme-color);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    label {
      font-size: 20px;
      display: block;
      margin-top: 10px;
      color: var(--user-theme-color);
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px 14px;
      margin: 6px 0;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      background-color: #0d1117;
      color: #fff;
      font-size: 20px;
    }

    button {
      background-color: var(--user-theme-color);
      color: #000;
      font-weight: bold;
      border: 2px solid #000;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 3px 3px 0px #000;
      margin-top: 10px;
      min-height: 44px;
    }

    button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }
    .btn-secondary { background-color: #21262d; color: #fff; border-color: var(--border-color); }

    .avatar-preview {
      width: 80px; height: 80px;
      border: 3px solid var(--user-theme-color);
      border-radius: 50%; object-fit: cover;
      display: block; margin: 10px auto;
      image-rendering: pixelated;
    }

    .area-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px; margin-top: 15px;
      max-height: 350px; overflow-y: auto;
    }

    .area-card {
      background: #21262d; border: 2px solid var(--border-color);
      border-radius: 6px; padding: 10px; text-align: center; cursor: pointer;
    }

    .area-card:hover { border-color: var(--user-theme-color); }

    .table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 2px solid var(--border-color); padding: 8px; text-align: center; }
    th { background-color: #21262d; color: var(--user-theme-color); }

    /* ANIMAÇÃO DE SUBIDA NO RANKING */
    .ranking-row-updated {
      animation: highlightRow 1.5s ease-out;
    }

    @keyframes highlightRow {
      0% { background-color: rgba(0, 255, 102, 0.5); }
      100% { background-color: transparent; }
    }

    /* ESTILO GOOGLE FORMS PARA O PROFESSOR */
    .forms-card {
      background: #21262d;
      border: 2px solid var(--border-color);
      border-left: 6px solid var(--user-theme-color);
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }

    .radio-check {
      width: 25px;
      height: 25px;
      cursor: pointer;
      accent-color: var(--user-theme-color);
    }

    .btn-add-question {
      background-color: #0088ff;
      color: #fff;
      font-size: 28px;
      line-height: 20px;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin: 15px auto;
      display: block;
    }

    @media (max-width: 600px) {
      .banner-img { height: 110px; }
      .app-container { padding: 10px; }
      .tab-btn { font-size: 16px; padding: 8px 10px; }
    }
  </style>
</head>
<body>

  <!-- BANNER DA LOGO MT.PNG FIXO NO TOPO DO FORMULÁRIO -->
  <div class="banner-container">
    <img src="mt.png" alt="MATHQUEST BANNER" class="banner-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'800\' height=\'200\' width=\'100%\'><rect width=\'100%\' height=\'100%\' fill=\'%23161b22\'/><text x=\'50%\' y=\'50%\' fill=\'%2300ff66\' font-size=\'40\' font-family=\'monospace\' dominant-baseline=\'middle\' text-anchor=\'middle\'>MATHQUEST FORMULÁRIO</text></svg>'">
  </div>

  <div class="app-container">

    <!-- REGISTRO/LOGIN DO ALUNO -->
    <div id="screen-login" class="screen active">
      <h2 style="margin-top:0; text-align:center; color: var(--user-theme-color);">🎮 ENTRAR NO MATHQUEST</h2>
      <label>Seu Apelido:</label>
      <input type="text" id="player-name" placeholder="Ex: MathMaster">

      <label>Escolha a Cor do Seu Tema:</label>
      <input type="color" id="player-color" value="#00ff66">

      <label>Foto de Perfil:</label>
      <input type="file" id="player-photo" accept="image/*">
      <img id="preview-img" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='65' height='65'><rect width='65' height='65' fill='%23161b22'/></svg>">

      <button onclick="registerStudent()">ENTRAR E SALVAR PERFIL</button>
      <button class="btn-secondary" onclick="showScreen('screen-prof-login')">🔒 Área do Professor</button>
    </div>

    <!-- LOGIN DO PROFESSOR -->
    <div id="screen-prof-login" class="screen">
      <h2 style="margin-top:0; color: var(--user-theme-color);">🔑 ACESSO DOCENTE</h2>
      <label>Senha do Professor:</label>
      <input type="password" id="prof-pass" placeholder="Digite a senha...">
      <button onclick="loginProfessor()">ENTRAR NO PAINEL</button>
      <button class="btn-secondary" onclick="showScreen('screen-login')">VOLTAR</button>
    </div>

    <!-- PAINEL DO ALUNO -->
    <div id="screen-student-dash" class="screen">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchStudentTab('tab-quizzes', this)">📚 QUIZZES</button>
        <button class="tab-btn" onclick="switchStudentTab('tab-ranking', this)">🏆 RANKING EM TEMPO REAL</button>
        <button class="tab-btn" onclick="switchStudentTab('tab-profile', this)">👤 MEU PERFIL</button>
      </div>

      <!-- ABA 1: FAZER QUIZZES -->
      <div id="tab-quizzes" class="tab-content">
        <h3 style="margin-top:0; color: var(--user-theme-color);">ESCOLHA UM QUIZ DO PROFESSOR OU UMA ÁREA:</h3>
        <div id="prof-quizzes-container"></div>
        <div id="area-grid-container" class="area-grid"></div>
      </div>

      <!-- ABA 2: RANKING ATUALIZADO EM TEMPO REAL -->
      <div id="tab-ranking" class="tab-content" style="display:none;">
        <h3 style="margin-top:0; color: var(--user-theme-color);">⚡ RANKING EM TEMPO REAL (ACERTOS / PONTOS)</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr><th>POS</th><th>ALUNO</th><th>ACERTOS</th><th>PONTOS</th></tr>
            </thead>
            <tbody id="student-ranking-body"></tbody>
          </table>
        </div>
      </div>

      <!-- ABA 3: PERFIL EDITÁVEL A QUALQUER HORA -->
      <div id="tab-profile" class="tab-content" style="display:none;">
        <h3 style="margin-top:0; color: var(--user-theme-color);">✏️ EDITAR MEU PERFIL</h3>
        <img id="edit-display-photo" class="avatar-preview" src="">
        <label>Seu Apelido:</label>
        <input type="text" id="edit-player-name" disabled>

        <label>Alterar Cor do Tema:</label>
        <input type="color" id="edit-player-color">

        <label>Alterar Foto:</label>
        <input type="file" id="edit-player-photo" accept="image/*">

        <button onclick="saveProfileChanges()">SALVAR ALTERAÇÕES</button>
        <button class="btn-secondary" onclick="logoutStudent()">SAIR DA CONTA</button>
      </div>
    </div>

    <!-- TELA DA APLICAÇÃO DO QUIZ -->
    <div id="screen-quiz" class="screen">
      <span id="quiz-area-badge" style="color: var(--user-theme-color); font-size:22px;"></span>
      <h3 id="quiz-question-title" style="font-size: 26px;"></h3>
      <div id="quiz-options-container"></div>
      <div id="quiz-feedback" style="display:none; margin-top: 15px;">
        <div id="feedback-badge"></div>
        <p id="feedback-explanation" style="background:#21262d; padding:10px; border-radius:4px;"></p>
        <button onclick="nextQuestionInQuiz()">PRÓXIMA ➔</button>
      </div>
    </div>

    <!-- PAINEL DO PROFESSOR -->
    <div id="screen-prof-dash" class="screen">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchProfTab('tab-generator', this)">📝 GERADOR DE QUIZ</button>
        <button class="tab-btn" onclick="switchProfTab('tab-accesses', this)">👥 ALUNOS CADASTRADOS</button>
        <button class="tab-btn" onclick="switchProfTab('tab-prof-ranking', this)">🏆 RANKING GERAL</button>
      </div>

      <!-- ABA 1: GERADOR DE QUIZ ESTILO GOOGLE FORMS -->
      <div id="tab-generator" class="tab-content">
        <label>Título do Formulário / Quiz do Professor:</label>
        <input type="text" id="forms-title" placeholder="Ex: Avaliação de Álgebra - 1º Bimestre">

        <label>Selecione a Área da Matemática:</label>
        <select id="forms-area"></select>

        <div id="forms-questions-container"></div>

        <button type="button" class="btn-add-question" onclick="addQuestionCardForms()" title="Adicionar Pergunta">+</button>

        <button onclick="saveFullQuizForms()" style="background-color: var(--user-theme-color); font-size: 22px;">SALVAR E PUBLICAR QUIZ 🚀</button>
        <button class="btn-secondary" onclick="showScreen('screen-login')">SAIR</button>
      </div>

      <!-- ABA 2: LISTA DE ACESSOS -->
      <div id="tab-accesses" class="tab-content" style="display:none;">
        <h3 style="margin-top:0; color: var(--user-theme-color);">👥 LISTA DE ALUNOS PARTICIPANTES</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr><th>FOTO</th><th>NOME / APELIDO</th><th>TOTAL ACERTOS</th><th>PONTUAÇÃO</th></tr>
            </thead>
            <tbody id="prof-accesses-body"></tbody>
          </table>
        </div>
      </div>

      <!-- ABA 3: RANKING NO PAINEL DO PROFESSOR -->
      <div id="tab-prof-ranking" class="tab-content" style="display:none;">
        <h3 style="margin-top:0; color: var(--user-theme-color);">🏆 RANKING GERAL EM TEMPO REAL</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr><th>POS</th><th>ALUNO</th><th>DESEMPENHO</th></tr>
            </thead>
            <tbody id="prof-ranking-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyATKw8PTw2zH4qGn1OyFNmtBdCbt_ofSvk",
      authDomain: "mathques.firebaseapp.com",
      databaseURL: "https://mathques-default-rtdb.firebaseio.com",
      projectId: "mathques",
      storageBucket: "mathques.firebasestorage.app",
      messagingSenderId: "413245852392",
      appId: "1:413245852392:web:fd9affbddda2f34eed975d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const areasMatematica = [
      "Álgebra", "Aritmética Básica", "Geometria Plana", "Geometria Espacial",
      "Geometria Analítica", "Trigonometria", "Estatística", "Probabilidade",
      "Cálculo Diferencial", "Cálculo Integral", "Matemática Financeira", "Raciocínio Lógico",
      "Teoria dos Números", "Equações do 1º e 2º Grau", "Porcentagem e Proporção",
      "Matrizes e Determinantes", "Funções Matemáticas", "Análise Combinatória",
      "Progressão Aritmética (PA)", "Progressão Geométrica (PG)"
    ];

    let currentUser = null;
    let questionCardCount = 0;
    let currentQuizList = [];
    let currentQuizIndex = 0;

    window.addEventListener('DOMContentLoaded', () => {
      populateAreaSelects();
      checkSavedProfile();
    });

    function populateAreaSelects() {
      const select = document.getElementById('forms-area');
      select.innerHTML = '';
      areasMatematica.forEach(a => {
        let opt = document.createElement('option');
        opt.value = a; opt.innerText = a;
        select.appendChild(opt);
      });
    }

    function checkSavedProfile() {
      const savedUser = localStorage.getItem('mathquest_student');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        applyUserTheme(currentUser.color);
        loadStudentProfileUI();
        listenToRealtimeData();
        renderAreaCards();
        showScreen('screen-student-dash');
      }
    }

    function applyUserTheme(color) {
      document.documentElement.style.setProperty('--user-theme-color', color || '#00ff66');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    /* SISTEMA DE ABAS LADO A LADO */
    function switchStudentTab(tabId, btn) {
      document.querySelectorAll('#screen-student-dash .tab-content').forEach(c => c.style.display = 'none');
      document.querySelectorAll('#screen-student-dash .tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      btn.classList.add('active');
    }

    function switchProfTab(tabId, btn) {
      document.querySelectorAll('#screen-prof-dash .tab-content').forEach(c => c.style.display = 'none');
      document.querySelectorAll('#screen-prof-dash .tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      btn.classList.add('active');
    }

    /* ATUALIZAÇÃO DO RANKING EM TEMPO REAL */
    function listenToRealtimeData() {
      db.ref('students').on('value', snapshot => {
        const sBody = document.getElementById('student-ranking-body');
        const pRankBody = document.getElementById('prof-ranking-body');
        const pAccBody = document.getElementById('prof-accesses-body');
        
        sBody.innerHTML = ''; pRankBody.innerHTML = ''; pAccBody.innerHTML = '';

        let players = [];
        snapshot.forEach(c => players.push(c.val()));
        
        // ORDENA EM TEMPO REAL PELOS ACERTOS / PONTOS
        players.sort((a,b) => (b.score||0) - (a.score||0));

        players.forEach((p, i) => {
          let pos = i + 1;
          let medal = pos === 1 ? '🥇 ' : pos === 2 ? '🥈 ' : pos === 3 ? '🥉 ' : `${pos}º`;
          let correctAnswers = Math.floor((p.score || 0) / 10);

          let rowHtml = `<tr class="ranking-row-updated">
            <td><strong>${medal}</strong></td>
            <td style="color:${p.color}; font-weight:bold;">${p.name}</td>
            <td>${correctAnswers} acertos</td>
            <td><strong>${p.score || 0} PTS</strong></td>
          </tr>`;

          sBody.innerHTML += rowHtml;

          pRankBody.innerHTML += `<tr>
            <td><strong>${medal}</strong></td>
            <td style="color:${p.color}">${p.name}</td>
            <td>${p.score||0} PTS (${correctAnswers} acertos)</td>
          </tr>`;

          pAccBody.innerHTML += `<tr>
            <td><img src="${p.photo || ''}" style="width:35px;height:35px;border-radius:50%;object-fit:cover;"></td>
            <td style="color:${p.color}">${p.name}</td>
            <td>${correctAnswers} acertos</td>
            <td>${p.score||0} PTS</td>
          </tr>`;
        });
      });

      /* CARREGA QUIZZES GERADOS EM TEMPO REAL */
      db.ref('teacher_quizzes').on('value', snapshot => {
        const container = document.getElementById('prof-quizzes-container');
        container.innerHTML = '';
        snapshot.forEach(child => {
          const quiz = child.val();
          let btn = document.createElement('button');
          btn.className = 'btn-secondary';
          btn.style.borderLeft = '6px solid var(--user-theme-color)';
          btn.innerText = `📋 QUIZ DO PROFESSOR: ${quiz.title} (${quiz.area})`;
          btn.onclick = () => startTeacherQuiz(quiz);
          container.appendChild(btn);
        });
      });
    }

    /* RESPOSTAS E ATUALIZAÇÃO IMEDIATA DO SCORE NO FIREBASE */
    function checkAnswer(opt, q) {
      const feedback = document.getElementById('quiz-feedback');
      const badge = document.getElementById('feedback-badge');
      const exp = document.getElementById('feedback-explanation');

      if (opt === q.correct) {
        badge.innerText = "RESPOSTA CORRETA! 🎉 (+10 PTS / +1 ACERTO)";
        badge.style.color = "#00ff66";
        
        if (currentUser) {
          currentUser.score = (currentUser.score || 0) + 10;
          // ATUALIZA NO FIREBASE EM TEMPO REAL
          db.ref('students/' + currentUser.name + '/score').set(currentUser.score);
          localStorage.setItem('mathquest_student', JSON.stringify(currentUser));
        }
      } else {
        badge.innerText = "RESPOSTA INCORRETA! ❌";
        badge.style.color = "#ff0055";
      }

      exp.innerText = q.explanation || "Sem explicação cadastrada.";
      feedback.style.display = 'block';
    }

    /* GERADOR ESTILO GOOGLE FORMS DO PROFESSOR */
    function addQuestionCardForms() {
      questionCardCount++;
      const id = questionCardCount;
      const container = document.getElementById('forms-questions-container');

      const card = document.createElement('div');
      card.className = 'forms-card';
      card.id = `qcard-${id}`;
      card.innerHTML = `
        <label>Pergunta ${id}:</label>
        <input type="text" class="q-title" placeholder="Digite o enunciado da questão...">

        <label>Tipo de Resposta:</label>
        <select class="q-type" onchange="renderOptionsByFormsType(${id})">
          <option value="multiple">Múltipla Escolha</option>
          <option value="tf">Verdadeiro ou Falso</option>
        </select>

        <label>Opções (Marque com o ✔️ a resposta correta):</label>
        <div id="q-options-box-${id}"></div>

        <label>Explicação / Passo a Passo:</label>
        <textarea class="q-explanation" rows="2" placeholder="Explicação da resposta..."></textarea>
      `;
      container.appendChild(card);
      renderOptionsByFormsType(id);
    }

    function renderOptionsByFormsType(cardId) {
      const card = document.getElementById(`qcard-${cardId}`);
      const type = card.querySelector('.q-type').value;
      const box = document.getElementById(`q-options-box-${cardId}`);
      box.innerHTML = '';

      if (type === 'multiple') {
        for (let i = 1; i <= 4; i++) {
          box.innerHTML += `
            <div class="option-row">
              <input type="radio" name="correct-${cardId}" class="radio-check" value="${i-1}" ${i===1?'checked':''} title="Marque a resposta correta ✔️">
              <input type="text" class="q-opt-text" placeholder="Opção ${i}">
            </div>
          `;
        }
      } else {
        box.innerHTML = `
          <div class="option-row">
            <input type="radio" name="correct-${cardId}" class="radio-check" value="Verdadeiro" checked>
            <span>Verdadeiro ✔️</span>
          </div>
          <div class="option-row">
            <input type="radio" name="correct-${cardId}" class="radio-check" value="Falso">
            <span>Falso ✔️</span>
          </div>
        `;
      }
    }

    function saveFullQuizForms() {
      const title = document.getElementById('forms-title').value.trim();
      const area = document.getElementById('forms-area').value;
      const cards = document.querySelectorAll('.forms-card');

      if (!title) return alert('DIGITE O TÍTULO DO FORMULÁRIO!');
      if (cards.length === 0) return alert('ADICIONE PELO MENOS UMA PERGUNTA CLICANDO NO BOTÃO +');

      let questions = [];

      cards.forEach(card => {
        const qTitle = card.querySelector('.q-title').value.trim();
        const type = card.querySelector('.q-type').value;
        const explanation = card.querySelector('.q-explanation').value.trim();
        let correctVal = "";
        let optionsArr = [];

        if (type === 'multiple') {
          const optInputs = card.querySelectorAll('.q-opt-text');
          const selectedRadio = card.querySelector(`input[name="correct-${card.id.split('-')[1]}"]:checked`).value;
          
          optInputs.forEach((inp, idx) => {
            const val = inp.value.trim() || `Opção ${idx+1}`;
            optionsArr.push(val);
            if (idx == selectedRadio) correctVal = val;
          });
        } else {
          correctVal = card.querySelector(`input[name="correct-${card.id.split('-')[1]}"]:checked`).value;
          optionsArr = ["Verdadeiro", "Falso"];
        }

        if (qTitle) {
          questions.push({ title: qTitle, options: optionsArr, correct: correctVal, explanation: explanation });
        }
      });

      db.ref('teacher_quizzes').push({ title, area, questions }, err => {
        if (!err) {
          alert('QUIZ CRIADO E PUBLICADO COM SUCESSO! ✔️');
          document.getElementById('forms-questions-container').innerHTML = '';
          document.getElementById('forms-title').value = '';
          questionCardCount = 0;
          addQuestionCardForms();
        }
      });
    }

    /* EDICAO DE PERFIL DO ALUNO */
    function registerStudent() {
      const name = document.getElementById('player-name').value.trim();
      const color = document.getElementById('player-color').value;
      const photo = document.getElementById('preview-img').src;

      if (!name) return alert('Informe seu apelido!');

      currentUser = { name, color, photo, score: 0 };
      localStorage.setItem('mathquest_student', JSON.stringify(currentUser));
      db.ref('students/' + name).set({ name, color, photo, score: 0 });

      applyUserTheme(color);
      loadStudentProfileUI();
      listenToRealtimeData();
      renderAreaCards();
      showScreen('screen-student-dash');
    }

    function loadStudentProfileUI() {
      document.getElementById('edit-player-name').value = currentUser.name;
      document.getElementById('edit-player-color').value = currentUser.color;
      document.getElementById('edit-display-photo').src = currentUser.photo;
    }

    function saveProfileChanges() {
      const newColor = document.getElementById('edit-player-color').value;
      currentUser.color = newColor;

      const fileInp = document.getElementById('edit-player-photo');
      if (fileInp.files[0]) {
        const reader = new FileReader();
        reader.onload = () => {
          currentUser.photo = reader.result;
          updateProfileInFirebase();
        };
        reader.readAsDataURL(fileInp.files[0]);
      } else {
        updateProfileInFirebase();
      }
    }

    function updateProfileInFirebase() {
      localStorage.setItem('mathquest_student', JSON.stringify(currentUser));
      db.ref('students/' + currentUser.name).update({
        color: currentUser.color,
        photo: currentUser.photo
      });
      applyUserTheme(currentUser.color);
      loadStudentProfileUI();
      alert('Perfil atualizado com sucesso!');
    }

    function startTeacherQuiz(quizObj) {
      currentQuizList = quizObj.questions;
      currentQuizIndex = 0;
      document.getElementById('quiz-area-badge').innerText = `QUIZ: ${quizObj.title}`;
      loadCurrentQuizQuestion();
      showScreen('screen-quiz');
    }

    function loadCurrentQuizQuestion() {
      const q = currentQuizList[currentQuizIndex];
      document.getElementById('quiz-question-title').innerText = `${currentQuizIndex+1}. ${q.title}`;
      document.getElementById('quiz-feedback').style.display = 'none';

      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';

      q.options.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'btn-secondary';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, q);
        container.appendChild(btn);
      });
    }

    function nextQuestionInQuiz() {
      currentQuizIndex++;
      if (currentQuizIndex < currentQuizList.length) {
        loadCurrentQuizQuestion();
      } else {
        alert('QUIZ CONCLUÍDO!');
        showScreen('screen-student-dash');
      }
    }

    function renderAreaCards() {
      const container = document.getElementById('area-grid-container');
      container.innerHTML = '';
      areasMatematica.forEach(area => {
        let card = document.createElement('div');
        card.className = 'area-card';
        card.innerText = area;
        container.appendChild(card);
      });
    }

    function loginProfessor() {
      if (document.getElementById('prof-pass').value === 'professor72') {
        showScreen('screen-prof-dash');
        listenToRealtimeData();
        if(questionCardCount === 0) addQuestionCardForms();
      } else {
        alert('Senha incorreta!');
      }
    }

    function logoutStudent() {
      localStorage.removeItem('mathquest_student');
      currentUser = null;
      showScreen('screen-login');
    }
  </script>
</body>
</html>
